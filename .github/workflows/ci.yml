name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first — no point burning
# minutes on a commit that is already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / test / build
    runs-on: ubuntu-latest

    env:
      # The build imports modules that read these at module scope, so it
      # needs them present. They are deliberately obvious non-secrets:
      # nothing here talks to a real project, and no real key should ever
      # be needed to prove the code compiles. /api/health treats values
      # shaped like this as unconfigured, which is exactly right for CI.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      ANTHROPIC_API_KEY: placeholder-anthropic-key
      CRON_SECRET: placeholder-cron-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci, not npm install: it installs exactly the lockfile and
      # fails if package.json and the lock have drifted apart, which is a
      # real defect worth failing on rather than silently resolving.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
